name: rerun
on:
  workflow_dispatch:
    inputs:
      cases:
        description: "Case list (one ARVO id per line), path in this repo"
        required: true
        default: "cases/smoke.txt"
      shards:
        description: "Number of parallel runners (max 20 concurrent on the Free plan)"
        required: true
        default: "20"

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.s.outputs.shards }}
    steps:
      - id: s
        run: |
          n=${{ github.event.inputs.shards }}
          echo "shards=$(python3 -c "import json;print(json.dumps(list(range($n))))")" >> "$GITHUB_OUTPUT"

  rerun:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJson(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
      - name: Free disk for multi-GB images
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af >/dev/null
          df -h /
      - name: Docker Hub login (optional, raises the pull limit)
        env:
          DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USER }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        if: env.DOCKERHUB_TOKEN != ''
        run: echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USER" --password-stdin
      - name: Replay this shard's cases
        run: |
          n=${{ github.event.inputs.shards }}
          i=0
          while read -r id; do
            [ -z "$id" ] && continue
            if [ $(( i % n )) -eq ${{ matrix.shard }} ]; then
              bash scripts/rerun.sh "$id" "out/$id"
            fi
            i=$((i+1))
          done < "${{ github.event.inputs.cases }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-${{ matrix.shard }}
          path: out/
          retention-days: 30
          if-no-files-found: warn
