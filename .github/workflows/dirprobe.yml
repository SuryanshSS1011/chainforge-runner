name: dirprobe
on:
  workflow_dispatch:
    inputs:
      cases:
        description: "Encrypted case list (openssl aes-256-cbc -pbkdf2, key in the CF_KEY secret)"
        required: true
      shards:
        description: "Parallel runners"
        required: true
        default: "40"
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.s.outputs.shards }}
    steps:
      - id: s
        run: echo "shards=$(python3 -c "import json;print(json.dumps(list(range(${{ github.event.inputs.shards }}))))")" >> "$GITHUB_OUTPUT"
  check:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJson(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
      - name: Free disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL; docker system prune -af >/dev/null
      - name: Docker Hub login
        env:
          DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USER }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        if: env.DOCKERHUB_TOKEN != ''
        run: echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USER" --password-stdin
      - name: Decide read or write at each site (sites stay encrypted at rest and out of the log)
        env:
          CF_KEY: ${{ secrets.CF_KEY }}
        run: |
          openssl enc -d -aes-256-cbc -pbkdf2 -pass env:CF_KEY -in "${{ github.event.inputs.cases }}" -out /tmp/cases.tsv
          mkdir -p out /tmp/specs
          n=${{ github.event.inputs.shards }}
          cut -f1 /tmp/cases.tsv | sort -u > /tmp/ids
          i=0
          while read -r id; do
            if [ $(( i % n )) -eq ${{ matrix.shard }} ]; then
              awk -F'\t' -v id="$id" '$1==id{print $2"\t"$3"\t"$4"\t"$5}' /tmp/cases.tsv > /tmp/specs/$id.tsv
              bash scripts/access_direction.sh "$id" /tmp/specs/$id.tsv </dev/null >> out/dirprobe.jsonl
            fi
            i=$((i+1))
          done < /tmp/ids
          rm -rf /tmp/cases.tsv /tmp/specs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dirprobe-${{ matrix.shard }}
          path: out/
          if-no-files-found: warn
