name: minimize
on:
  workflow_dispatch:
    inputs:
      cases:
        description: "Encrypted case list (<arvo id>\\t<project>\\t<patch url>\\t<hunk>)"
        required: true
      shards:
        description: "Parallel runners"
        required: true
        default: "100"
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.s.outputs.shards }}
    steps:
      - id: s
        run: echo "shards=$(python3 -c "import json;print(json.dumps(list(range(${{ github.event.inputs.shards }}))))")" >> "$GITHUB_OUTPUT"
  minimize:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJson(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
      - name: Free disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL; docker system prune -af >/dev/null
      - name: Docker Hub login
        env:
          DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USER }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        if: env.DOCKERHUB_TOKEN != ''
        run: echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USER" --password-stdin
      - name: Minimize this shard (inputs and results stay encrypted)
        env:
          CF_KEY: ${{ secrets.CF_KEY }}
        run: |
          openssl enc -d -aes-256-cbc -pbkdf2 -pass env:CF_KEY -in "${{ github.event.inputs.cases }}" -out /tmp/cases.tsv
          n=${{ github.event.inputs.shards }}; i=0; mkdir -p /tmp/res out
          while IFS=$'\t' read -r id project url hunk; do
            [ -z "$id" ] && continue
            if [ $(( i % n )) -eq ${{ matrix.shard }} ]; then
              python3 scripts/minimize.py "$id" "$project" "$url" "$hunk" "/tmp/res/$id" </dev/null >/dev/null 2>&1 || true
              cat "/tmp/res/$id/result.json" >> /tmp/min.jsonl 2>/dev/null; echo >> /tmp/min.jsonl
            fi
            i=$((i+1))
          done < /tmp/cases.tsv
          openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:CF_KEY -in /tmp/min.jsonl -out out/min.enc
          rm -f /tmp/cases.tsv /tmp/min.jsonl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: min-${{ matrix.shard }}
          path: out/
          if-no-files-found: warn
