name: numerics
on:
  push:
    branches: [numerics-ci]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: numerics-${{ github.ref }}
  cancel-in-progress: true
jobs:
  hf:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        model:
          - openai-community/gpt2
          - HuggingFaceTB/SmolLM2-135M
          - HuggingFaceTB/SmolLM2-360M
          - Qwen/Qwen2.5-0.5B
          - Qwen/Qwen3-0.6B
          - TinyLlama/TinyLlama-1.1B-Chat-v1.0
        mode: [fp32, bf16emu, bf16]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install -q torch==2.9.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -q transformers==4.57.1 numpy huggingface_hub
      - name: Census
        run: python runner/hf_census.py --model "${{ matrix.model }}" --mode "${{ matrix.mode }}" --budget 55 --out out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hf-${{ strategy.job-index }}
          path: out
  hwref:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
        replica: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install -q torch==2.9.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -q transformers==4.57.1 numpy huggingface_hub
      - name: Reference fingerprints
        run: |
          T=${{ matrix.os }}-r${{ matrix.replica }}
          python runner/hf_census.py --model HuggingFaceTB/SmolLM2-135M --mode fp32 --tests ref,threads --tag $T --out out
          python runner/hf_census.py --model HuggingFaceTB/SmolLM2-135M --mode bf16emu --tests ref,threads --tag $T --out out
          python runner/hf_census.py --model HuggingFaceTB/SmolLM2-135M --mode bf16 --tests ref --tag $T --out out || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hwref-${{ strategy.job-index }}
          path: out
  llamacpp:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        repo:
          - bartowski/SmolLM2-135M-Instruct-GGUF
          - bartowski/SmolLM2-360M-Instruct-GGUF
          - bartowski/Qwen2.5-0.5B-Instruct-GGUF
          - Qwen/Qwen2.5-0.5B-Instruct-GGUF
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install -q numpy huggingface_hub
          pip install -q llama-cpp-python==0.3.16 --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu || pip install -q llama-cpp-python
          python -c "import llama_cpp as l; print(l.__version__, [n for n in ('llama_model_load_from_file','llama_init_from_model','llama_get_memory','llama_memory_clear','llama_kv_self_clear','llama_vocab_n_tokens') if hasattr(l, n)])"
      - name: Fetch models
        run: python runner/fetch_gguf.py "${{ matrix.repo }}" models
      - name: Census
        run: |
          for f in models/*.gguf; do
            python runner/llamacpp_census.py --gguf "$f" --label "$(basename "$f" .gguf)" --budget 35 --out out || echo "FAILED $f"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: llamacpp-${{ strategy.job-index }}
          path: out
  engine_api:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        dtype: [bfloat16, float32]
    steps:
      - uses: actions/checkout@v4
      - name: Free disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h / | tail -1
          grep -m1 "model name" /proc/cpuinfo
          grep -m1 -o -E "avx512f|avx512_bf16" /proc/cpuinfo | sort -u | tr '\n' ' ' || true
      - name: Start server
        run: |
          mkdir -p out
          IMG=public.ecr.aws/q9t5s3a7/vllm-cpu-release-repo
          docker pull -q $IMG:latest || docker pull -q $IMG:v0.11.0 || docker pull -q $IMG:v0.10.2 || docker pull -q $IMG:v0.9.2
          TAG=$(docker images --format '{{.Repository}}:{{.Tag}}' | grep vllm-cpu | head -1)
          echo "image $TAG" | tee out/image-${{ matrix.dtype }}.txt
          docker run -d --name srv --privileged=true --shm-size=4g -p 8000:8000 -e VLLM_CPU_KVCACHE_SPACE=4 $TAG \
            --model Qwen/Qwen2.5-0.5B-Instruct --dtype ${{ matrix.dtype }} --max-logprobs 20 --max-model-len 2048
          for i in $(seq 1 96); do
            if curl -sf localhost:8000/health > /dev/null; then echo up; break; fi
            if [ -z "$(docker ps -q -f name=srv)" ]; then echo "server exited"; break; fi
            sleep 5
          done
          docker logs srv 2>&1 | tail -30
          curl -sf localhost:8000/v1/models | head -c 400
      - name: Census
        run: python3 runner/api_census.py http://localhost:8000 Qwen/Qwen2.5-0.5B-Instruct out vllm-cpu-${{ matrix.dtype }}
      - name: Logs
        if: always()
        run: docker logs srv > out/server-${{ matrix.dtype }}.log 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: engine-api-${{ strategy.job-index }}
          path: out
