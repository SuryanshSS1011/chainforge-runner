name: kboot
# Does the guest's NUMA layout decide whether a Linux 7.0 syzbot kernel boots? Three jobs draw three
# hosted machines, whose CPUs vary (scripts/kboot_numa.sh).
on:
  workflow_dispatch:

jobs:
  kboot:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        draw: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          path: runner
      - name: Free disk for kernel builds
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Re-run CHAINFORGE-0800011 with one NUMA node, then boot its fix^ kernel five ways
        run: bash runner/scripts/kboot_numa.sh out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kboot-${{ matrix.draw }}
          path: out/
          retention-days: 30
          if-no-files-found: warn
