name: fixdist
on:
  workflow_dispatch:
    inputs:
      cases:
        description: "Case list: <arvo id>\\t<fix sha> per line"
        required: true
      shards:
        description: "Parallel runners"
        required: true
        default: "20"
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.s.outputs.shards }}
    steps:
      - id: s
        run: echo "shards=$(python3 -c "import json;print(json.dumps(list(range(${{ github.event.inputs.shards }}))))")" >> "$GITHUB_OUTPUT"
  probe:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJson(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
      - name: Free disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL; docker system prune -af >/dev/null
      - name: Docker Hub login
        env:
          DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USER }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        if: env.DOCKERHUB_TOKEN != ''
        run: echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USER" --password-stdin
      - name: Measure image distance from the fix
        run: |
          n=${{ github.event.inputs.shards }}; i=0; : > fixdist.jsonl
          while IFS=$'\t' read -r id fix; do
            [ -z "$id" ] && continue
            if [ $(( i % n )) -eq ${{ matrix.shard }} ]; then
              bash scripts/fix_distance.sh "$id" "$fix" </dev/null >> fixdist.jsonl
              docker system prune -af >/dev/null 2>&1
            fi
            i=$((i+1))
          done < "${{ github.event.inputs.cases }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fixdist-${{ matrix.shard }}
          path: fixdist.jsonl
